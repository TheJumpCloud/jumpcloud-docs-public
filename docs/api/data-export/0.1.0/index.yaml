paths:
  /v2/events:
    get:
      operationId: getEventsPull
      summary: List SIEM Events
      description: |
        Returns paginated inline JSON events for the authenticated org from materialized S3 partitions.
        Partition objects are newline-delimited JSON (NDJSON); each line is one event. Pagination
        cursors are opaque and may resume mid-object via object key and line offset.
        Filter by `event_types` (comma-separated or repeated query values) or `event_types=all` for
        the full export catalogue (at most 25 explicit slugs per request). Multiple types are
        processed in ascending slug order within each page.
        The time window `(until - since)` must not exceed one hour. Requests with `until` beyond the
        writer freshness horizon (`now - 15 minutes`) return HTTP 422 with `available_until`.
        Send `Accept: application/json` for raw partitions or `Accept: application/ocsf+json` for OCSF.
        Responses use Cache-Control no-store.
      tags:
        - SIEM Integration
      x-scopes:
        - directoryinsights.readonly
      security:
        - ApiKeyAuth: []
      parameters:
        - name: since
          in: query
          required: true
          description: Window start (RFC3339)
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: true
          description: Window end (RFC3339); must be after since and within 1 hour of since
          schema:
            type: string
            format: date-time
        - name: event_types
          in: query
          required: true
          description: |
            One or more event type partition names. Pass multiple types as a comma-separated list in a single value (e.g. `event_types=user_login_attempt,admin_login_attempt`) or repeat the parameter. Use the literal value `all` alone to select the full export catalogue. At most 25 explicit slugs per request (no limit when using `all`).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
          example:
            - user_login_attempt
            - admin_login_attempt
        - name: limit
          in: query
          required: false
          description: Maximum events per page (default 1000, max 1000)
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
        - name: next_cursor
          in: query
          required: false
          description: Pagination cursor from a previous response
          schema:
            type: string
      responses:
        '200':
          description: Paginated inline events
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPullResponse'
            application/ocsf+json:
              schema:
                $ref: '#/components/schemas/EventsPullResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          description: Requested window extends beyond available writer data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPullNotAvailableError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request GET \
              --url 'https://api.jumpcloud.com/data-export/v2/events?since=SOME_STRING_VALUE&until=SOME_STRING_VALUE&event_types=user_login_attempt&event_types=admin_login_attempt&limit=SOME_INTEGER_VALUE&next_cursor=SOME_STRING_VALUE' \
              --header 'x-api-key: REPLACE_KEY_VALUE'
        - lang: Python
          source: |-
            import requests

            url = "https://api.jumpcloud.com/data-export/v2/events"

            querystring = {"since":"SOME_STRING_VALUE","until":"SOME_STRING_VALUE","event_types":["user_login_attempt","admin_login_attempt"],"limit":"SOME_INTEGER_VALUE","next_cursor":"SOME_STRING_VALUE"}

            headers = {"x-api-key": "REPLACE_KEY_VALUE"}

            response = requests.request("GET", url, headers=headers, params=querystring)

            print(response.text)
        - lang: Powershell
          source: |-
            $headers=@{}
            $headers.Add("x-api-key", "REPLACE_KEY_VALUE")
            $response = Invoke-RestMethod -Uri 'https://api.jumpcloud.com/data-export/v2/events?since=SOME_STRING_VALUE&until=SOME_STRING_VALUE&event_types=user_login_attempt&event_types=admin_login_attempt&limit=SOME_INTEGER_VALUE&next_cursor=SOME_STRING_VALUE' -Method GET -Headers $headers
  /v2/siem/connection-test:
    post:
      operationId: siemConnectionTest
      summary: Validate SIEM Pull Connectivity
      description: |
        First-time SIEM validation before scheduled event pulls. Confirms org binding and S3 partition reachability
        under the authenticated org prefix without returning event payloads.
      tags:
        - SIEM Integration
      x-scopes:
        - directoryinsights.readonly
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Connection test succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiemConnectionTestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      x-codeSamples:
        - lang: Shell
          source: |-
            curl --request POST \
              --url https://api.jumpcloud.com/data-export/v2/siem/connection-test \
              --header 'x-api-key: REPLACE_KEY_VALUE'
        - lang: Python
          source: |-
            import requests

            url = "https://api.jumpcloud.com/data-export/v2/siem/connection-test"

            headers = {"x-api-key": "REPLACE_KEY_VALUE"}

            response = requests.request("POST", url, headers=headers)

            print(response.text)
        - lang: Powershell
          source: |-
            $headers=@{}
            $headers.Add("x-api-key", "REPLACE_KEY_VALUE")
            $response = Invoke-RestMethod -Uri 'https://api.jumpcloud.com/data-export/v2/siem/connection-test' -Method POST -Headers $headers
x-tagGroups:
  - name: API Reference
    tags:
      - SIEM Integration
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    EventsPullResponse:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          description: Inline JSON events parsed from NDJSON partition objects (one array element per event line)
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: string
          nullable: true
          description: Present when more events remain in the requested window
    EventsPullNotAvailableError:
      type: object
      required:
        - error
        - available_until
        - message
      properties:
        error:
          type: string
          example: requested window extends beyond available data
        available_until:
          type: string
          format: date-time
          description: Latest until timestamp currently materialized in S3
        message:
          type: string
          example: Data is available up to 2026-08-20T15:25:00Z. Retry after the writer catches up.
    SiemConnectionTestResponse:
      type: object
      required:
        - ok
        - org_id
      properties:
        ok:
          type: boolean
          example: true
        org_id:
          type: string
          description: Authenticated org ObjectID (hex)
          example: 507f1f77bcf86cd799439012
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    NotAcceptableError:
      type: object
      required:
        - message
        - supported_types
      properties:
        message:
          type: string
        supported_types:
          type: array
          items:
            type: string
          example:
            - application/json
            - application/ocsf+json
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid Insights API token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Token lacks required scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: Organization lacks Directory Insights Premium entitlement
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAcceptable:
      description: Unsupported Accept header for GET /v2/events (ADR-3)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotAcceptableError'
    TooManyRequests:
      description: Per-org SIEM events pull rate limit exceeded
      headers:
        Retry-After:
          description: Suggested wait time in seconds before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
x-scopes:
  - directoryinsights.readonly
